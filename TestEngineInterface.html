<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dino Game - Engine RealTime</title>
  <style>
    canvas {
      border: 1px solid black;
    }
  </style>
</head>
<body>
  <h1>Dino Game (Engine RealTime) - Modelo Carregado!</h1>
  <canvas id="gameCanvas" width="600" height="150"></canvas>
  <p>O modelo escolhido tomará decisões automaticamente. Confira no console do navegador.</p>

  <!-- 1) Importar TensorFlow.js (CDN ou local) -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.20.0/dist/tf.min.js"></script>

  <script>
    class GameEngine {
      constructor() {
        this.reset();
      }

      reset() {
        this.tRex = {
          xPos: 50,
          yPos: 0,
          jumping: false,
          ducking: false,
          velocityY: 0,
          width: 44,
          height: 47,
          collisionBoxes: [
            { x: 1, y: 1, width: 30, height: 35 },
            { x: 5, y: 35, width: 20, height: 10 },
          ],
        };

        this.obstacles = [];
        this.score = 0;
        this.gameOver = false;
        this.currentSpeed = 6;
        this.maxSpeed = 12;
        this.acceleration = 0.002;
        this.gravity = -0.6;
        this.jumpVelocity = 10;
        this.groundYPos = 0;
        this.time = Date.now();
        this.deltaTime = 0;
        this.distanceRan = 0;
        this.scoreCoefficient = 0.025;
        this.msPerFrame = 1000 / 60;
        this.nextObstacleDistance = null;
        this.dimensions = {
          WIDTH: 600,
          HEIGHT: 150,
        };
      }

      update(action) {
        if (this.gameOver) return;

        const now = Date.now();
        this.deltaTime = now - (this.time || now);
        this.time = now;

        // Ação do modelo
        this.handleAction(action);
        this.updateTRex();
        this.updateObstacles();

        if (this.checkCollision()) {
          this.gameOver = true;
        } else {
          this.distanceRan += (this.currentSpeed * this.deltaTime) / this.msPerFrame;
          this.score = Math.floor(this.distanceRan * this.scoreCoefficient);

          if (this.currentSpeed < this.maxSpeed) {
            this.currentSpeed += this.acceleration * (this.deltaTime / this.msPerFrame);
          }
        }
      }

      handleAction(action) {
        // 0 => Pular, 1 => Abaixar, 2 => Nada
        if (action === 0 && !this.tRex.jumping && !this.tRex.ducking) {
          this.tRex.jumping = true;
          this.tRex.velocityY = this.jumpVelocity;
        } else if (action === 1 && !this.tRex.jumping) {
          this.tRex.ducking = true;
          this.tRex.height = 25;
          this.tRex.width = 59;
        } else if (action === 2) {
          if (this.tRex.ducking) {
            this.tRex.ducking = false;
            this.tRex.height = 47;
            this.tRex.width = 44;
          }
        }
      }

      updateTRex() {
        if (this.tRex.jumping) {
          this.tRex.velocityY += this.gravity;
          this.tRex.yPos += this.tRex.velocityY;

          if (this.tRex.yPos <= 0) {
            this.tRex.yPos = 0;
            this.tRex.jumping = false;
            this.tRex.velocityY = 0;
          }
        }
      }

      updateObstacles() {
        this.obstacles.forEach((obstacle) => {
          obstacle.xPos -= this.currentSpeed * (this.deltaTime / this.msPerFrame);
        });

        this.obstacles = this.obstacles.filter(
          (obstacle) => obstacle.xPos + obstacle.width > 0
        );

        if (this.shouldAddNewObstacle()) {
          this.addNewObstacle();
        }
      }

      shouldAddNewObstacle() {
        if (this.obstacles.length === 0) return true;

        const lastObstacle = this.obstacles[this.obstacles.length - 1];

        if (!this.nextObstacleDistance) {
          const minGap = (120 + this.currentSpeed * 12) * 1.2;
          const maxGap = (220 + this.currentSpeed * 14) * 1.2;
          this.nextObstacleDistance =
            Math.floor(Math.random() * (maxGap - minGap + 1)) + minGap;
        }

        return (
          lastObstacle.xPos + lastObstacle.width <
          this.dimensions.WIDTH - this.nextObstacleDistance
        );
      }

      addNewObstacle() {
        const obstacleTypes = this.score >= 300
          ? [
              { width: 30, height: 35, yPos: 0 },
              { width: 40, height: 35, yPos: 0 },
              { width: 50, height: 35, yPos: 0 },
              { width: 60, height: 35, yPos: 0 },
              { width: 25, height: 45, yPos: 0 },
              { width: 45, height: 45, yPos: 0 },
              { width: 60, height: 45, yPos: 0 },
              { width: 30, height: 25, yPos: 30 },
              { width: 30, height: 25, yPos: 80 },
            ]
          : [
              { width: 30, height: 35, yPos: 0 },
              { width: 40, height: 35, yPos: 0 },
              { width: 50, height: 35, yPos: 0 },
              { width: 60, height: 35, yPos: 0 },
              { width: 25, height: 45, yPos: 0 },
              { width: 45, height: 45, yPos: 0 },
              { width: 60, height: 45, yPos: 0 },
            ];

        const obstacleType =
          obstacleTypes[Math.floor(Math.random() * obstacleTypes.length)];

        const obstacle = {
          xPos: this.dimensions.WIDTH,
          yPos: obstacleType.yPos,
          width: obstacleType.width,
          height: obstacleType.height,
          collisionBoxes: [{ x: 0, y: 0, width: obstacleType.width, height: obstacleType.height }],
        };

        this.obstacles.push(obstacle);
        this.nextObstacleDistance = null;
      }

      checkCollision() {
        for (let obstacle of this.obstacles) {
          if (this.isColliding(this.tRex, obstacle)) {
            return true;
          }
        }
        return false;
      }

      isColliding(tRex, obstacle) {
        for (let tRexBox of tRex.collisionBoxes) {
          const adjTrexBox = {
            x: tRex.xPos + tRexBox.x,
            y: this.dimensions.HEIGHT - tRex.height - tRex.yPos + tRexBox.y,
            width: tRexBox.width,
            height: tRexBox.height,
          };

          for (let obstacleBox of obstacle.collisionBoxes) {
            const adjObstacleBox = {
              x: obstacle.xPos + obstacleBox.x,
              y: this.dimensions.HEIGHT - obstacle.height - obstacle.yPos + obstacleBox.y,
              width: obstacleBox.width,
              height: obstacleBox.height,
            };

            if (this.boxCompare(adjTrexBox, adjObstacleBox)) {
              return true;
            }
          }
        }
        return false;
      }

      boxCompare(boxA, boxB) {
        return !(
          boxA.x > boxB.x + boxB.width ||
          boxA.x + boxA.width < boxB.x ||
          boxA.y > boxB.y + boxB.height ||
          boxA.y + boxA.height < boxB.y
        );
      }

      // Montar state usado para a predição do modelo
      getStateForModel() {
        let firstObstacle = this.obstacles[0] || null;
        return {
          tRexY: this.tRex.yPos,
          tRexVelocityY: this.tRex.velocityY,
          tRexX: this.tRex.xPos,
          obstacleX: firstObstacle ? firstObstacle.xPos : null,
          obstacleWidth: firstObstacle ? firstObstacle.width : null,
          obstacleHeight: firstObstacle ? firstObstacle.height : null,
        };
      }

      getDisplayState() {
        return {
          tRex: { ...this.tRex },
          obstacles: this.obstacles.map(o => ({
            xPos: o.xPos,
            yPos: o.yPos,
            width: o.width,
            height: o.height
          })),
          score: this.score,
          gameOver: this.gameOver
        };
      }
    }

    // -----------------------------------------------------------
    // 2) LÓGICA PARA CARREGAR O MODELO E PREDIZER A AÇÃO
    // -----------------------------------------------------------
    let loadedModel = null;

    // Vamos ler o param "modelFolder" passado na URL
    // Ex: http://localhost:3002/?modelFolder=model-worker-49-generation-88
    const urlParams = new URLSearchParams(window.location.search);
    const modelFolder = urlParams.get('modelFolder') || 'model-worker-49-generation-88';

    async function loadTrainedModel() {
      const modelUrl = `./${modelFolder}/model.json`; 
      // Ex: se modelFolder="model-worker-49-generation-88", 
      // => "./model-worker-49-generation-88/model.json"

      console.log('Carregando modelo a partir de', modelUrl);
      loadedModel = await tf.loadLayersModel(modelUrl);
      console.log('Modelo carregado com sucesso:', loadedModel);
    }

    function normalizeState(state) {
      const maxDistance = 600;
      const maxTReXJumpHeight = 100;
      const maxVelocityY = 20;
      const maxObstacleWidth = 50;
      const maxObstacleHeight = 50;

      const distanceToObstacle = state.obstacleX !== null
        ? (state.obstacleX - state.tRexX) / maxDistance
        : 1;
      const obstacleInSight = state.obstacleX !== null ? 1 : 0;
      const tRexOnGround = state.tRexY === 0 ? 1 : 0;

      return [
        (state.tRexY + maxTReXJumpHeight) / maxTReXJumpHeight,
        state.tRexVelocityY / maxVelocityY,
        distanceToObstacle,
        (state.obstacleWidth  || 0) / maxObstacleWidth,
        (state.obstacleHeight || 0) / maxObstacleHeight,
        obstacleInSight,
        tRexOnGround
      ];
    }

    function predictAction(stateForModel) {
      if (!loadedModel) return 2; // Se não tem modelo, "faz nada" (2)

      return tf.tidy(() => {
        const normState = normalizeState(stateForModel);
        const stateTensor = tf.tensor2d([normState], undefined, 'float32');
        const actionProbs = loadedModel.predict(stateTensor);

        // ArgMax
        const action = actionProbs.argMax(1).dataSync()[0];
        console.log(`Decisão do modelo: ${action} (0=jump,1=duck,2=none)`);
        return action;
      });
    }

    // -----------------------------------------------------------
    // 3) INICIALIZAÇÃO DO GAME
    // -----------------------------------------------------------
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gameEngine = new GameEngine();

    function drawTRex(tRex) {
      ctx.fillStyle = 'green';
      ctx.fillRect(tRex.xPos, canvas.height - tRex.height - tRex.yPos, tRex.width, tRex.height);
    }

    function drawObstacles(obstacles) {
      ctx.fillStyle = 'red';
      obstacles.forEach(obstacle => {
        ctx.fillRect(
          obstacle.xPos,
          canvas.height - obstacle.height - obstacle.yPos,
          obstacle.width,
          obstacle.height
        );
      });
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function renderGame(displayState) {
      clearCanvas();
      drawTRex(displayState.tRex);
      drawObstacles(displayState.obstacles);

      ctx.fillStyle = 'black';
      ctx.font = '20px Arial';
      ctx.fillText(`Score: ${displayState.score}`, 500, 20);
    }

    async function gameLoop() {
      // A cada frame, pedimos o state pro model
      const stateForModel = gameEngine.getStateForModel();
      const action = predictAction(stateForModel);

      // rodamos update
      gameEngine.update(action);
      const displayState = gameEngine.getDisplayState();
      renderGame(displayState);

      if (!displayState.gameOver) {
        requestAnimationFrame(gameLoop);
      } else {
        alert(`Game Over! Pontuação: ${displayState.score}`);
      }
    }

    // Carregar o modelo, depois iniciar o loop
    loadTrainedModel().then(() => {
      console.log('Iniciando gameLoop com modelo treinado...');
      gameLoop();
    }).catch(err => {
      console.error('Erro ao carregar modelo:', err);
      alert('Falha ao carregar o modelo. Veja console.log');
    });
  </script>
</body>
</html>
